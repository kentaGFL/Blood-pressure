<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <!-- スマホアプリ用メタタグ（PWA） -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#ef4444">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>血圧手帳</title>
    
    <!-- 動的Manifest用のリンク -->
    <link rel="manifest" id="manifest-link">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
            background-color: #f1f5f9; /* bg-slate-100 */
            -webkit-tap-highlight-color: transparent;
        }
        /* モーダルのスライドアニメーション */
        .modal-enter { transform: translateY(100%); opacity: 0; }
        .modal-enter-active { transform: translateY(0); opacity: 1; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .modal-exit { transform: translateY(0); opacity: 1; }
        .modal-exit-active { transform: translateY(100%); opacity: 0; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        
        /* スクロールバー非表示 */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col pb-24 relative overflow-x-hidden">

    <!-- トースト通知 -->
    <div id="toast" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 pointer-events-none transition-all duration-300 transform -translate-y-20 opacity-0 w-11/12 max-w-sm">
        <div class="bg-slate-900/90 backdrop-blur-sm text-white text-xs font-bold py-2.5 px-4 rounded-xl shadow-lg flex items-center justify-center gap-2 border border-slate-700">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-emerald-400 shrink-0" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" />
            </svg>
            <span id="toast-message" class="truncate"></span>
        </div>
    </div>

    <!-- ヘッダー -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-20 shadow-xs">
        <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="bg-rose-500 text-white p-1.5 rounded-lg shadow-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M3.172 5.172a4 4 0 015.656 0L10 6.343l1.172-1.171a4 4 0 115.656 5.656L10 17.657l-6.828-6.829a4 4 0 010-5.656z" clip-rule="evenodd" />
                    </svg>
                </div>
                <div>
                    <h1 class="text-lg font-black text-slate-900 tracking-tight leading-tight">血圧手帳</h1>
                </div>
            </div>
            <div class="flex items-center gap-1.5">
                <!-- 同期バッジ -->
                <div id="sync-status" class="inline-flex items-center gap-1 text-[10px] font-bold px-2 py-1 rounded-full bg-emerald-100 text-emerald-700">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>保存済み
                </div>
                <!-- CSV出力ボタン -->
                <button onclick="exportRecordsToCsv()" title="CSV出力" class="p-1.5 text-slate-600 hover:text-slate-900 bg-slate-100 hover:bg-slate-200 rounded-lg transition active:scale-95 flex items-center gap-1 text-xs font-bold px-2.5">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-emerald-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                    </svg>
                    <span>CSV</span>
                </button>
                <!-- 設定ボタン -->
                <button onclick="openSettingsModal()" title="AI設定（任意）" class="p-1.5 text-slate-500 hover:text-slate-800 bg-slate-100 hover:bg-slate-200 rounded-lg transition active:scale-95">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <!-- メインコンテンツ -->
    <main class="flex-1 w-full max-w-md mx-auto px-4 py-4 space-y-4">
        
        <!-- クイック写真入力カード -->
        <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
            <label class="flex items-center justify-center gap-3 w-full py-3.5 px-4 bg-gradient-to-r from-sky-500 to-blue-600 hover:from-sky-600 hover:to-blue-700 text-white rounded-xl shadow-md shadow-sky-200 cursor-pointer active:scale-95 transition">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
                <div class="text-left">
                    <div class="text-sm font-bold leading-tight">写真から日時・数値を自動入力</div>
                    <div class="text-[10px] text-sky-100">カメラ撮影・ライブラリから7セグ解析</div>
                </div>
                <input type="file" accept="image/*" onchange="openModalAndProcessPhoto(event)" class="hidden">
            </label>
        </div>

        <!-- サマリー（平均値カード） -->
        <div class="grid grid-cols-3 gap-2.5">
            <div class="bg-white p-3 rounded-2xl border border-slate-200 shadow-xs text-center">
                <div class="text-[10px] font-bold text-slate-400 mb-0.5">平均 最高</div>
                <div class="flex items-baseline justify-center gap-0.5">
                    <span id="stat-sys" class="text-2xl font-black text-rose-600">-</span>
                    <span class="text-[10px] text-slate-400 font-bold">mmHg</span>
                </div>
            </div>
            <div class="bg-white p-3 rounded-2xl border border-slate-200 shadow-xs text-center">
                <div class="text-[10px] font-bold text-slate-400 mb-0.5">平均 最低</div>
                <div class="flex items-baseline justify-center gap-0.5">
                    <span id="stat-dia" class="text-2xl font-black text-sky-600">-</span>
                    <span class="text-[10px] text-slate-400 font-bold">mmHg</span>
                </div>
            </div>
            <div class="bg-white p-3 rounded-2xl border border-slate-200 shadow-xs text-center">
                <div class="text-[10px] font-bold text-slate-400 mb-0.5">平均 脈拍</div>
                <div class="flex items-baseline justify-center gap-0.5">
                    <span id="stat-pulse" class="text-2xl font-black text-emerald-600">-</span>
                    <span class="text-[10px] text-slate-400 font-bold">bpm</span>
                </div>
            </div>
        </div>

        <!-- 記録ヘッダー -->
        <div class="flex items-center justify-between pt-1">
            <h2 class="text-sm font-bold text-slate-700 flex items-center gap-1.5">
                <span>測定履歴</span>
                <span id="record-count" class="text-xs font-semibold px-2 py-0.5 rounded-full bg-slate-200 text-slate-600">0件</span>
            </h2>
            <button onclick="exportRecordsToCsv()" class="text-xs font-bold text-sky-600 hover:text-sky-700 flex items-center gap-1 transition">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                </svg>
                CSVエクスポート
            </button>
        </div>

        <!-- 記録リスト (カード形式) -->
        <div id="record-list" class="space-y-2.5">
            <!-- JavaScriptで動的生成 -->
        </div>
    </main>

    <!-- Floating Action Button (FAB) -->
    <button onclick="openModal()" aria-label="新規記録を追加" class="fixed bottom-6 right-6 w-14 h-14 bg-rose-500 text-white rounded-full shadow-xl shadow-rose-300 hover:bg-rose-600 hover:scale-105 active:scale-95 transition-all flex items-center justify-center z-30">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
        </svg>
    </button>

    <!-- 入力モーダル (Bottom Sheet風) -->
    <div id="add-modal" class="fixed inset-0 z-50 hidden flex-col justify-end">
        <!-- 背景オーバーレイ -->
        <div id="modal-backdrop" class="absolute inset-0 bg-slate-900/60 opacity-0 transition-opacity" onclick="closeModal()"></div>
        
        <!-- モーダル本体 -->
        <div id="modal-content" class="bg-white w-full max-w-md mx-auto rounded-t-3xl shadow-2xl relative z-10 modal-enter max-h-[92vh] flex flex-col">
            <!-- モーダルヘッダー -->
            <div class="p-4 pb-2 border-b border-slate-100 flex justify-between items-center shrink-0">
                <div class="flex items-center gap-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-rose-500"></span>
                    <h2 class="text-base font-bold text-slate-800">新しい血圧記録</h2>
                </div>
                <button onclick="closeModal()" class="p-1.5 text-slate-400 hover:text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-full transition">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" />
                    </svg>
                </button>
            </div>

            <!-- スクロール可能ボディ -->
            <div class="p-4 overflow-y-auto space-y-4 flex-1">
                
                <!-- 写真入力ボタン -->
                <label class="flex flex-col items-center justify-center w-full py-3.5 border-2 border-dashed border-sky-300 rounded-2xl bg-sky-50 text-sky-700 hover:bg-sky-100 transition cursor-pointer active:scale-98">
                    <div class="flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-sky-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
                        </svg>
                        <span id="photo-btn-text" class="text-sm font-bold">写真から数値を自動読み取り</span>
                    </div>
                    <span class="text-[10px] text-sky-500 mt-0.5">液晶を写すと日時と数値を自動抽出します</span>
                    <input type="file" accept="image/*" onchange="processPhoto(event)" class="hidden">
                </label>

                <!-- 【機能1】写真選択時の元写真プレビュー＆拡大（ピンチ操作/ズームボタン） -->
                <div id="photo-ref-container" class="hidden rounded-2xl overflow-hidden border border-slate-700 shadow-md bg-slate-900 transition-all">
                    <!-- ツールバー -->
                    <div class="px-3 py-2 bg-slate-800 text-white flex items-center justify-between border-b border-slate-700 text-xs">
                        <div class="flex items-center gap-1.5 font-bold text-slate-200">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-sky-400 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v6m3-3H7" />
                            </svg>
                            <span>元写真プレビュー</span>
                            <span id="photo-zoom-level" class="text-[10px] px-1.5 py-0.5 rounded bg-sky-900 text-sky-300 font-mono font-bold">1.0x</span>
                        </div>
                        <!-- 拡大操作ボタン群（1x, 1.5x, 2x, リセット） -->
                        <div class="flex items-center gap-1">
                            <button type="button" onclick="setPhotoZoom(1.0)" class="zoom-preset-btn px-2 py-1 rounded bg-sky-600 text-white text-[11px] font-bold transition" data-zoom="1">1x</button>
                            <button type="button" onclick="setPhotoZoom(1.5)" class="zoom-preset-btn px-2 py-1 rounded bg-slate-700 hover:bg-slate-600 text-slate-200 text-[11px] font-bold transition" data-zoom="1.5">1.5x</button>
                            <button type="button" onclick="setPhotoZoom(2.0)" class="zoom-preset-btn px-2 py-1 rounded bg-slate-700 hover:bg-slate-600 text-slate-200 text-[11px] font-bold transition" data-zoom="2">2x</button>
                            <button type="button" onclick="resetPhotoZoom()" title="表示をリセット" class="p-1 rounded bg-slate-700 hover:bg-slate-600 text-slate-300 transition">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" viewBox="0 0 20 20" fill="currentColor">
                                    <path fill-rule="evenodd" d="M4 2a1 1 0 011 1v2.101a7.002 7.002 0 0111.601 2.566 1 1 0 11-1.885.666A5.002 5.002 0 005.999 7H9a1 1 0 010 2H4a1 1 0 01-1-1V3a1 1 0 011-1zm.008 9.057a1 1 0 011.276.61A5.002 5.002 0 0014.001 13H11a1 1 0 110-2h5a1 1 0 011 1v5a1 1 0 11-2 0v-2.101a7.002 7.002 0 01-11.601-2.566 1 1 0 01.61-1.276z" clip-rule="evenodd" />
                                </svg>
                            </button>
                        </div>
                    </div>
                    <!-- ビューポート（タッチでピンチ＆ドラッグ対応） -->
                    <div id="photo-viewport" class="relative w-full h-52 bg-slate-950 overflow-hidden cursor-grab active:cursor-grabbing select-none flex items-center justify-center touch-none">
                        <img id="photo-ref-img" src="" alt="血圧計写真プレビュー" class="max-w-none max-h-none select-none pointer-events-none origin-center" style="transform: translate(0px, 0px) scale(1);" />
                        <div class="absolute bottom-1.5 right-2 pointer-events-none text-[10px] text-slate-300 bg-slate-900/80 px-2 py-0.5 rounded-full backdrop-blur-xs border border-slate-700">
                            ピンチ操作 / ドラッグで移動
                        </div>
                    </div>
                </div>

                <!-- 解析結果・ステータス表示エリア -->
                <div id="ai-status-box" class="hidden p-3 rounded-2xl text-xs border transition-all">
                    <div id="ai-status-title" class="font-bold mb-1"></div>
                    <div id="ai-status-detail" class="opacity-90 break-words whitespace-pre-line text-[11px] leading-relaxed"></div>
                    <div id="debug-preview-wrap" class="hidden mt-2 pt-2 border-t border-slate-200/60">
                        <div class="text-[10px] font-bold mb-1 text-slate-600">LCD自動検出・枠線除去・7セグ隙間補正画像:</div>
                        <img id="debug-preview-img" class="max-h-24 rounded border border-slate-300 mx-auto bg-white shadow-2xs" alt="加工後プレビュー">
                    </div>
                </div>

                <!-- 入力フォーム -->
                <form id="add-form" onsubmit="addRecord(event)" class="space-y-3.5">
                    
                    <!-- 日時入力 -->
                    <div class="grid grid-cols-2 gap-2 bg-slate-50 p-2.5 rounded-2xl border border-slate-200">
                        <div>
                            <label class="block text-[10px] font-bold text-slate-500 mb-1">測定日</label>
                            <input type="date" id="input-date" required class="w-full text-xs font-bold text-slate-800 bg-white p-2 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-sky-400">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-slate-500 mb-1">測定時刻</label>
                            <input type="time" id="input-time" required class="w-full text-xs font-bold text-slate-800 bg-white p-2 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-sky-400">
                        </div>
                    </div>

                    <!-- 【機能2】最高血圧入力欄 ＋ ワンタップ微調整ボタン（-1 / +1） -->
                    <div class="bg-rose-50/50 p-3 rounded-2xl border border-rose-100">
                        <div class="flex items-center justify-between mb-1">
                            <label for="input-sys" class="text-xs font-bold text-rose-950 flex items-center gap-1.5">
                                <span class="w-2.5 h-2.5 rounded-full bg-rose-500"></span>最高血圧 (SYS)
                            </label>
                            <span class="text-[10px] font-bold text-rose-400">mmHg</span>
                        </div>
                        <input type="number" id="input-sys" required placeholder="120" min="30" max="300" class="w-full text-center text-3xl font-black text-rose-600 py-1.5 px-3 bg-white rounded-xl border border-rose-200 focus:outline-none focus:ring-2 focus:ring-rose-400 shadow-2xs">
                        
                        <!-- 微調整ボタン -->
                        <div class="flex items-center justify-center gap-2 mt-2">
                            <button type="button" onclick="adjustValue('input-sys', -5)" class="px-3 py-1.5 text-xs font-bold text-slate-600 bg-white hover:bg-slate-100 active:scale-95 border border-slate-200 rounded-lg shadow-2xs transition">-5</button>
                            <button type="button" onclick="adjustValue('input-sys', -1)" class="flex-1 py-1.5 text-xs font-black text-rose-700 bg-white hover:bg-rose-100 active:scale-95 border border-rose-300 rounded-lg shadow-2xs transition flex items-center justify-center gap-1">
                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M20 12H4"/></svg>
                                <span>-1</span>
                            </button>
                            <button type="button" onclick="adjustValue('input-sys', 1)" class="flex-1 py-1.5 text-xs font-black text-rose-700 bg-white hover:bg-rose-100 active:scale-95 border border-rose-300 rounded-lg shadow-2xs transition flex items-center justify-center gap-1">
                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/></svg>
                                <span>+1</span>
                            </button>
                            <button type="button" onclick="adjustValue('input-sys', 5)" class="px-3 py-1.5 text-xs font-bold text-slate-600 bg-white hover:bg-slate-100 active:scale-95 border border-slate-200 rounded-lg shadow-2xs transition">+5</button>
                        </div>
                    </div>

                    <!-- 【機能2】最低血圧入力欄 ＋ ワンタップ微調整ボタン（-1 / +1） -->
                    <div class="bg-sky-50/50 p-3 rounded-2xl border border-sky-100">
                        <div class="flex items-center justify-between mb-1">
                            <label for="input-dia" class="text-xs font-bold text-sky-950 flex items-center gap-1.5">
                                <span class="w-2.5 h-2.5 rounded-full bg-sky-500"></span>最低血圧 (DIA)
                            </label>
                            <span class="text-[10px] font-bold text-sky-400">mmHg</span>
                        </div>
                        <input type="number" id="input-dia" required placeholder="80" min="30" max="250" class="w-full text-center text-3xl font-black text-sky-600 py-1.5 px-3 bg-white rounded-xl border border-sky-200 focus:outline-none focus:ring-2 focus:ring-sky-400 shadow-2xs">
                        
                        <!-- 微調整ボタン -->
                        <div class="flex items-center justify-center gap-2 mt-2">
                            <button type="button" onclick="adjustValue('input-dia', -5)" class="px-3 py-1.5 text-xs font-bold text-slate-600 bg-white hover:bg-slate-100 active:scale-95 border border-slate-200 rounded-lg shadow-2xs transition">-5</button>
                            <button type="button" onclick="adjustValue('input-dia', -1)" class="flex-1 py-1.5 text-xs font-black text-sky-700 bg-white hover:bg-sky-100 active:scale-95 border border-sky-300 rounded-lg shadow-2xs transition flex items-center justify-center gap-1">

    <script>
        // ==========================================
        // PWA Setup
        // ==========================================
        function setupPWA() {
            try {
                const manifest = {
                    name: "血圧手帳",
                    short_name: "血圧手帳",
                    start_url: "./",
                    display: "standalone",

                    icons: [

                            src: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23ef4444'/%3E%3Cpath d='M50 30 C30 15 15 35 30 55 L50 75 L70 55 C85 35 70 15 50 30 Z' fill='white'/%3E%3C/svg%3E",
                            sizes: "192x192 512x512",
                            type: "image/svg+xml"
                        }
                    ]
                };
                const blob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
                const manifestUrl = URL.createObjectURL(blob);
                const link = document.getElementById('manifest-link');
                if (link) link.setAttribute('href', manifestUrl);
            } catch (e) {
                console.warn('PWA setup skipped:', e);
