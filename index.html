            }
        }

        // 写真処理エントリーポイント
        async function processPhoto(event) {
            const file = event.target.files[0];
            if (!file) return;

            const btnText = document.getElementById('photo-btn-text');
            const originalText = btnText.textContent;
            btnText.textContent = '画像を読み取り中...';
            document.getElementById('ai-status-box').classList.add('hidden');
            
            // 【機能1】元写真をプレビューコンテナにロード＆ズームを1xにリセット
            const photoContainer = document.getElementById('photo-ref-container');
            const photoImg = document.getElementById('photo-ref-img');
            const reader = new FileReader();
            reader.onload = (e) => {
                photoImg.src = e.target.result;
                photoContainer.classList.remove('hidden');
                resetPhotoZoom();
            };
            reader.readAsDataURL(file);

            try {
                let dateInfo = "";
                // EXIF撮影日時またはファイル日時の初期フォールバック取得
                const exifDate = await readExifDateFull(file);
                let fallbackDate = new Date();
                if (exifDate && !isNaN(exifDate)) {
                    fallbackDate = exifDate;
                    dateInfo = `撮影日時(EXIF): ${fallbackDate.getFullYear()}-${String(fallbackDate.getMonth()+1).padStart(2,'0')}-${String(fallbackDate.getDate()).padStart(2,'0')} ${String(fallbackDate.getHours()).padStart(2,'0')}:${String(fallbackDate.getMinutes()).padStart(2,'0')}`;
                } else if (file.lastModified) {
                    fallbackDate = new Date(file.lastModified);
                    dateInfo = `ファイル日時: ${fallbackDate.getFullYear()}-${String(fallbackDate.getMonth()+1).padStart(2,'0')}-${String(fallbackDate.getDate()).padStart(2,'0')} ${String(fallbackDate.getHours()).padStart(2,'0')}:${String(fallbackDate.getMinutes()).padStart(2,'0')}`;
                } else {
                    dateInfo = `端末現在日時: ${fallbackDate.getFullYear()}-${String(fallbackDate.getMonth()+1).padStart(2,'0')}-${String(fallbackDate.getDate()).padStart(2,'0')} ${String(fallbackDate.getHours()).padStart(2,'0')}:${String(fallbackDate.getMinutes()).padStart(2,'0')}`;
                }

                // 初期日時を端末/ファイル日時としてセット
                applyDateToInputs(fallbackDate);

                btnText.textContent = '7セグ数値を解析中...';
                const result = await analyzeBloodPressureImage(file);

                if (result.data && (result.data.sys || result.data.dia || result.data.pulse)) {
                    if (result.data.sys) document.getElementById('input-sys').value = result.data.sys;
                    if (result.data.dia) document.getElementById('input-dia').value = result.data.dia;
                    if (result.data.pulse) document.getElementById('input-pulse').value = result.data.pulse;

                    // 画面表示日時の反映（--:--やnullでなければ上書き、未設定なら端末日時自動セットを維持）
                    let screenDateApplied = false;
                    const rDate = result.data.date;
                    const rTime = result.data.time;

                    const isValidDate = rDate && typeof rDate === 'string' && !rDate.includes('--') && !rDate.includes('- -') && /\d/.test(rDate);
                    const isValidTime = rTime && typeof rTime === 'string' && !rTime.includes('--') && !rTime.includes('- -') && /\d/.test(rTime);

                    if (isValidDate) {
                        const m = rDate.match(/(\d{1,2})[\/\-](\d{1,2})/);
                        if (m) {
                            const year = fallbackDate.getFullYear();
                            const month = m[1].padStart(2, '0');
                            const day = m[2].padStart(2, '0');
                            document.getElementById('input-date').value = `${year}-${month}-${day}`;
                            screenDateApplied = true;
                        }
                    }
                    if (isValidTime) {
                        const tm = rTime.match(/(\d{1,2})[:\s](\d{1,2})/);
                        if (tm) {
                            const hh = tm[1].padStart(2, '0');
                            const mm = tm[2].padStart(2, '0');
                            document.getElementById('input-time').value = `${hh}:${mm}`;
                            screenDateApplied = true;
                        }
                    }

                    if (screenDateApplied) {
                        dateInfo = `画面表示日時を反映: ${document.getElementById('input-date').value} ${document.getElementById('input-time').value}`;
                    } else {
                        dateInfo = `日時: 端末日時を自動セット（血圧計側は未設定「--:--」）\n[${document.getElementById('input-date').value} ${document.getElementById('input-time').value}]`;
                    }

                    const hasAll = result.data.sys && result.data.dia && result.data.pulse;
                    setAiStatus(
                        hasAll ? 'success' : 'warning',
                        hasAll ? `読み取り成功！（${result.method}）` : `一部数値を読み取りました（${result.method}）`,
                        `${dateInfo}\n最高血圧(SYS): ${result.data.sys || '未検出'} mmHg / 最低血圧(DIA): ${result.data.dia || '未検出'} mmHg / 脈拍(PULSE): ${result.data.pulse || '未検出'} 拍/分\n※誤読がある場合は下の「-1」「+1」ボタンですぐに修正できます。`,
                        result.previewUrl
                    );
                    showToast(hasAll ? '日時と数値を自動セットしました' : '数値を一部セットしました（確認してください）');
                } else {
                    document.getElementById('input-sys').focus();
                    setAiStatus('error', '数値の自動検出ができませんでした', `${dateInfo}\n${result.error || ''}\n上の写真プレビューを見ながら、数値を入力してください。`, result.previewUrl);
                    showToast('日時をセットしました（数値は写真を見ながら入力できます）');
                }
            } catch (err) {
                console.error("Photo processing error:", err);
                setAiStatus('error', '画像の処理中にエラーが発生しました', err.message);
                showToast('画像の読み取りに失敗しました');
            } finally {
                btnText.textContent = originalText;
                event.target.value = '';
            }
        }

        function openModalAndProcessPhoto(event) {
            openModal();
            processPhoto(event);
        }

        // ==========================================
        // UI レンダリング & CSVエクスポート (維持項目)
        // ==========================================
        function getBpStatus(sys, dia) {
            if (!sys || !dia) return { label: '-', color: 'bg-slate-100 text-slate-500' };
            if (sys < 115 && dia < 75) return { label: '正常', color: 'bg-emerald-100 text-emerald-700' };
            if (sys < 125 && dia < 75) return { label: '正常高', color: 'bg-teal-100 text-teal-700' };
            if (sys < 135 && dia < 85) return { label: '高値', color: 'bg-amber-100 text-amber-700' };
            return { label: '高血圧', color: 'bg-rose-100 text-rose-700' };
        }

        function renderList() {
            const list = document.getElementById('record-list');
            const countEl = document.getElementById('record-count');
            if (countEl) countEl.textContent = `${records.length}件`;
            if (!list) return;

            list.innerHTML = '';
            
            if (records.length === 0) {
                list.innerHTML = `
                    <div class="text-center py-12 px-4 bg-white rounded-2xl border border-slate-200 shadow-2xs">
                        <div class="w-12 h-12 bg-rose-50 text-rose-400 rounded-full flex items-center justify-center mx-auto mb-3">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                            </svg>
                        </div>
                        <div class="text-sm font-bold text-slate-700 mb-1">記録がありません</div>
                        <div class="text-xs text-slate-400">上の写真ボタンまたは右下の＋ボタンから<br>毎日の血圧を記録しましょう。</div>
                    </div>
                `;
                updateStats();
                return;
            }

            // 新しい順（降順）にソート
            records.sort((a, b) => {
                const dtA = `${a.date || ''} ${a.time || ''}`;
                const dtB = `${b.date || ''} ${b.time || ''}`;
                return dtB.localeCompare(dtA);
            });

            records.forEach(rec => {
                const status = getBpStatus(Number(rec.sys), Number(rec.dia));
                let displayDate = `${rec.date || ''} ${rec.time || ''}`;
                try {
                    const dateObj = new Date(`${rec.date}T${rec.time}`);
                    if (!isNaN(dateObj)) {
                        displayDate = `${dateObj.getMonth()+1}/${dateObj.getDate()} ${rec.time}`;
                    }
                } catch(e) {}
                
                const card = document.createElement('div');
                card.className = "bg-white p-3.5 rounded-2xl shadow-xs border border-slate-200 flex items-center justify-between";
                card.innerHTML = `
                    <div class="flex-1">
                        <div class="flex items-center gap-2 mb-1">
                            <span class="text-xs font-bold text-slate-500">${displayDate}</span>
                            <span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${status.color}">${status.label}</span>
                        </div>
                        <div class="flex items-end gap-3">
                            <div class="flex items-baseline gap-1">
                                <span class="text-2xl font-black text-slate-900">${rec.sys}</span>
                                <span class="text-sm font-bold text-slate-300">/</span>
                                <span class="text-2xl font-black text-slate-900">${rec.dia}</span>
                                <span class="text-[10px] font-bold text-slate-400 ml-0.5">mmHg</span>
                            </div>
                            <div class="text-xs font-bold text-slate-500 mb-1 flex items-center gap-1">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5 text-rose-500" viewBox="0 0 20 20" fill="currentColor">
                                    <path fill-rule="evenodd" d="M3.172 5.172a4 4 0 015.656 0L10 6.343l1.172-1.171a4 4 0 115.656 5.656L10 17.657l-6.828-6.829a4 4 0 010-5.656z" clip-rule="evenodd" />
                                </svg>
                                <span>${rec.pulse}</span>
                                <span class="text-[10px] text-slate-400 font-normal">bpm</span>
                            </div>
                        </div>
                        ${rec.memo ? `<div class="mt-1.5 text-xs text-slate-600 bg-slate-50 px-2.5 py-1 rounded-md inline-block break-all border border-slate-100">${escapeHtml(rec.memo)}</div>` : ''}
                    </div>
                    <button onclick="deleteRecord('${rec.id}')" title="削除" class="p-2 ml-2 text-slate-300 hover:text-rose-500 hover:bg-rose-50 rounded-full active:scale-90 transition">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd" />
                        </svg>
                    </button>
                `;
                list.appendChild(card);
            });
            updateStats();
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function addRecord(e) {
            e.preventDefault();
            const date = document.getElementById('input-date').value;
            const time = document.getElementById('input-time').value;
            const sys = Number(document.getElementById('input-sys').value);
            const dia = Number(document.getElementById('input-dia').value);
            const pulse = Number(document.getElementById('input-pulse').value);
            const memo = document.getElementById('input-memo').value;

            if (!date || !time || !sys || !dia) {
                showToast('最高血圧と最低血圧を入力してください');
                return;
            }

            const newId = String(Date.now());
            const newRecord = { id: newId, date, time, sys, dia, pulse: pulse || 0, memo };

            records.unshift(newRecord);
            saveRecordsToStorage();
            renderList();

            document.getElementById('input-sys').value = '';
            document.getElementById('input-dia').value = '';
            document.getElementById('input-pulse').value = '';
            document.getElementById('input-memo').value = '';
            closeModal();
            showToast('記録を保存しました');
        }

        function deleteRecord(id) {
            if (!confirm("この記録を削除しますか？")) return;
            records = records.filter(r => String(r.id) !== String(id));
            saveRecordsToStorage();
            renderList();
            showToast('記録を削除しました');
        }

        function updateStats() {
            const valid = records.filter(r => r.sys && r.dia);
            if (valid.length === 0) {
                document.getElementById('stat-sys').textContent = '-';
                document.getElementById('stat-dia').textContent = '-';
                document.getElementById('stat-pulse').textContent = '-';
                return;
            }
            document.getElementById('stat-sys').textContent = Math.round(valid.reduce((sum, r) => sum + Number(r.sys), 0) / valid.length);
            document.getElementById('stat-dia').textContent = Math.round(valid.reduce((sum, r) => sum + Number(r.dia), 0) / valid.length);
            
            const validPulse = records.filter(r => r.pulse && Number(r.pulse) > 0);
            if (validPulse.length > 0) {
                document.getElementById('stat-pulse').textContent = Math.round(validPulse.reduce((sum, r) => sum + Number(r.pulse), 0) / validPulse.length);
            } else {
                document.getElementById('stat-pulse').textContent = '-';
            }
        }

        // CSVエクスポート機能（維持項目・Excel対応UTF-8 BOM付き）
        function exportRecordsToCsv() {
            if (!records || records.length === 0) {
                showToast('エクスポートする記録がありません');
                return;
            }

            const headers = ['日付', '時刻', '最高血圧(SYS)', '最低血圧(DIA)', '脈拍(PULSE)', '状態', 'メモ'];
            const rows = records.map(r => {
                const st = getBpStatus(Number(r.sys), Number(r.dia));
                return [
                    r.date || '',
                    r.time || '',
                    r.sys || '',
                    r.dia || '',
                    r.pulse || '',
                    st.label || '',
                    `"${(r.memo || '').replace(/"/g, '""')}"`
                ].join(',');
            });

            // Excelで文字化けしないようUTF-8 BOM (\uFEFF) を付加
            const csvContent = '\uFEFF' + [headers.join(','), ...rows].join('\r\n');
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');

            const now = new Date();
            const dateStr = `${now.getFullYear()}${String(now.getMonth() + 1).padStart(2, '0')}${String(now.getDate()).padStart(2, '0')}`;
            link.setAttribute('href', url);
            link.setAttribute('download', `blood_pressure_${dateStr}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
            showToast('CSVファイルを書き出しました');
        }

        // ==========================================
        // モーダル & トースト操作
        // ==========================================
        const modal = document.getElementById('add-modal');
        const modalContent = document.getElementById('modal-content');
        const backdrop = document.getElementById('modal-backdrop');

        function openModal() {
            document.getElementById('ai-status-box').classList.add('hidden');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            requestAnimationFrame(() => {
                backdrop.classList.remove('opacity-0');
                backdrop.classList.add('opacity-100');
                modalContent.classList.remove('modal-enter');
                modalContent.classList.add('modal-enter-active');
            });
        }

        function closeModal() {
            backdrop.classList.remove('opacity-100');
            backdrop.classList.add('opacity-0');
            modalContent.classList.remove('modal-enter-active');
            modalContent.classList.add('modal-exit-active');
            
            setTimeout(() => {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
                modalContent.classList.remove('modal-exit-active');
                modalContent.classList.add('modal-enter');
            }, 300);
        }

        let toastTimeout;
        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-message').textContent = message;
            toast.classList.remove('-translate-y-20', 'opacity-0');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.add('-translate-y-20', 'opacity-0');
            }, 3000);
        }

        function openSettingsModal() {
            const savedKey = localStorage.getItem('gemini_api_key') || '';
            document.getElementById('gemini-api-key-input').value = savedKey;
            const sModal = document.getElementById('settings-modal');
            sModal.classList.remove('hidden');
            sModal.classList.add('flex');
        }

        function closeSettingsModal() {
            const sModal = document.getElementById('settings-modal');
            sModal.classList.add('hidden');
            sModal.classList.remove('flex');
        }

        function saveApiKey() {
            const key = document.getElementById('gemini-api-key-input').value.trim();
            if (key) {
                localStorage.setItem('gemini_api_key', key);
                showToast('Gemini APIキーを保存しました');
            } else {
                localStorage.removeItem('gemini_api_key');
                showToast('APIキーを解除しました（無料ローカルOCR使用）');
            }
            closeSettingsModal();
        }

        // グローバル公開
        window.openModal = openModal;
        window.closeModal = closeModal;
        window.openSettingsModal = openSettingsModal;
        window.closeSettingsModal = closeSettingsModal;
        window.saveApiKey = saveApiKey;
        window.processPhoto = processPhoto;
        window.openModalAndProcessPhoto = openModalAndProcessPhoto;
        window.addRecord = addRecord;
        window.deleteRecord = deleteRecord;
        window.exportRecordsToCsv = exportRecordsToCsv;
        window.adjustValue = adjustValue;
        window.setPhotoZoom = setPhotoZoom;
        window.resetPhotoZoom = resetPhotoZoom;
    </script>
</body>
</html>
